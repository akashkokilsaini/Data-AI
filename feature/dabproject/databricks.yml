    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: ""
      source_linked_deployment: false
    workspace:
      host: https://dbc-82b6e186-b8ed.cloud.databricks.com/
  
  uat:
    mode: production
    workspace:
      host: https://dbc-82b6e186-b8ed.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/akashkokilsaini@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/akashkokilsaini@gmail.com/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-82b6e186-b8ed.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/akashkokilsaini@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/akashkokilsaini@gmail.com/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: akashkokilsaini@gmail.com
        level: CAN_MANAGE
